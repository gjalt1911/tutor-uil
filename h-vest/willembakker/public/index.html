<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Willem Bakker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: vaste linkerrail (desktop) of horizontale tabbalk (telefoon); één inhoudskolom van max 1120px; samenvatting (tegels) vóór detail (tabellen). */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface2:#e8ecf2; --line:#d3dae3; --line2:#e4e8ee;
  --fg:#16202a; --fg2:#58667a; --fg3:#8a96a5;
  --accent:#b07d0a; --accent-ink:#5a4004; --accent-soft:#f7edcf;
  --red:#b5322a; --red-soft:#f8e2df; --blue:#1d5a9f; --blue-soft:#dde8f5; --ok:#22703f; --ok-soft:#dbeee2;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow','Segoe UI',Helvetica,Arial,sans-serif;
  --radius:6px; --shadow:0 1px 2px rgba(22,32,42,.06);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1419; --surface:#161e26; --surface2:#1e2933; --line:#2c3947; --line2:#232f3a;
    --fg:#e6ebf0; --fg2:#a0adba; --fg3:#6c7a88;
    --accent:#e8bb3a; --accent-ink:#f5d879; --accent-soft:#3a2d0e;
    --red:#e4695e; --red-soft:#3a1c19; --blue:#74a7e6; --blue-soft:#1a2c42; --ok:#5cc286; --ok-soft:#163124;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#161e26; --surface2:#1e2933; --line:#2c3947; --line2:#232f3a;
  --fg:#e6ebf0; --fg2:#a0adba; --fg3:#6c7a88;
  --accent:#e8bb3a; --accent-ink:#f5d879; --accent-soft:#3a2d0e;
  --red:#e4695e; --red-soft:#3a1c19; --blue:#74a7e6; --blue-soft:#1a2c42; --ok:#5cc286; --ok-soft:#163124;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:30px}h2{font-size:24px}h3{font-size:19px}h4{font-size:16px}
p{margin:0}
a{color:var(--blue)}
button{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"top top" "nav main"}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;flex:none}
.brand-name{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;letter-spacing:.01em}
.brand-sub{font-size:12px;color:var(--fg2);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav{grid-area:nav;display:flex;flex-direction:column;gap:2px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:10px;border-right:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:var(--radius);color:var(--fg2);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:var(--surface2);color:var(--fg)}
.nav a.active{background:var(--accent-soft);color:var(--accent-ink)}
.nav a .cnt{font-family:var(--display);font-size:13px;background:var(--surface2);color:var(--fg2);border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.nav a.active .cnt{background:var(--accent);color:#fff}
.main{grid-area:main;min-width:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{color:var(--fg2);max-width:62ch}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--fg2);white-space:nowrap;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--accent-soft);color:var(--accent-ink)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.info{background:var(--blue-soft);color:var(--blue)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--fg);font-weight:500;font-size:14px;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg2)}
.btn.ghost:hover{background:var(--surface2);color:var(--fg)}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);min-width:0}
.tile .lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg2);font-weight:600}
.tile .val{font-family:var(--display);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .sub{font-size:13px;color:var(--fg2)}
.tile.accent{border-left:4px solid var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line2)}
.card-head h3{display:flex;align-items:center;gap:10px}
.card-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.scroll{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;white-space:nowrap}
td.acts{white-space:nowrap;text-align:right}
td.dt{white-space:nowrap}
td.empty{color:var(--fg2);text-align:center;padding:22px}
tfoot td,tr.total td{font-weight:600;border-top:2px solid var(--line);background:var(--surface2)}
.muted{color:var(--fg2)}.small{font-size:13px}.strong{font-weight:600}
.neg{color:var(--red)}.pos{color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 12px;border:none;border-bottom:2px solid transparent;background:none;color:var(--fg2);font-weight:500;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab.active{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tab .cnt{font-size:12px;color:var(--fg3);margin-left:4px}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:140px;padding-top:6px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bar .b{width:100%;max-width:64px;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px}
.bar .b.neg{background:var(--red)}
.bar .b.acc{background:var(--accent)}
.bar .v{font-family:var(--display);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.bar .l{font-size:12px;color:var(--fg2)}
.meter{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.over{background:var(--ok)}
.list{display:flex;flex-direction:column;gap:10px}
.fact{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.fact:last-child{border-bottom:none}
.fact .d{font-family:var(--display);font-size:16px;font-weight:600;color:var(--fg2)}
.fact .t{font-weight:600}
.fact .s{font-size:13px;color:var(--fg2)}
.fact .s a{color:var(--fg3)}
.ev-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);text-align:left;color:inherit;min-width:0}
.ev:hover{border-color:var(--accent)}
.ev .when{font-family:var(--display);font-size:22px;font-weight:700}
.ev .cnt-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.member{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;box-shadow:var(--shadow);min-width:0}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;color:#fff;background:var(--blue)}
.member .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.member .nm{font-weight:600}
.member .rl{color:var(--fg2);font-size:13px}
.member .tk{font-size:13px}
.member .acts{display:flex;gap:4px;margin-top:6px}
.notice{padding:10px 14px;border-radius:var(--radius);background:var(--blue-soft);color:var(--blue);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--accent-soft);color:var(--accent-ink)}
.notice.bad{background:var(--red-soft);color:var(--red)}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:8px}
.prose ul{margin:0;padding-left:18px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--fg2)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pre{white-space:pre-wrap;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,15,20,.5)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:18px 20px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg2);font-weight:600}
.field input,.field select,.field textarea,.inline-input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--fg);width:100%;min-width:0}
.field textarea{min-height:110px;resize:vertical}
.field .hint{font-size:12px;color:var(--fg3)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:6px}
.err{color:var(--red);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.inline-input{width:auto}
select.inline-input{padding:5px 8px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.ring-row{display:flex;gap:8px;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:stretch}
.hero .card-body{gap:10px}
.palmares-top{display:flex;gap:10px;flex-wrap:wrap}
.medal{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);min-width:0}
.medal i{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.medal b{font-family:var(--display);font-size:16px;font-weight:600}
.medal span{font-size:13px;color:var(--fg2)}
.login{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.login-box{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:26px 24px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.login-box .mark{width:52px;height:52px}
.login-box h2{font-size:26px}
code.ww{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:2px 8px;user-select:all}
.notice{justify-content:space-between}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "nav" "main"}
  .nav{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding-block:8px;padding-right:max(16px,env(safe-area-inset-right,0px));max-height:none;gap:4px}
  .nav a{white-space:nowrap;padding:7px 10px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .frow{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .tile .val{font-size:28px}
}
@media (prefers-reduced-motion:no-preference){.btn,.nav a,.ev{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="#f4f4f2" stroke="#8a96a5" stroke-width="1"/>
        <circle cx="20" cy="20" r="15.2" fill="#1b1b1b"/>
        <circle cx="20" cy="20" r="11.4" fill="#1f63b4"/>
        <circle cx="20" cy="20" r="7.6" fill="#d8352a"/>
        <circle cx="20" cy="20" r="3.8" fill="#f2c12e"/>
      </svg>
      <div>
        <div class="brand-name">Willem Bakker</div>
        <div class="brand-sub">Teamportaal · recurve · Waalre</div>
      </div>
    </div>
    <div class="top-right row"><span id="modeBadge" class="pill"><span class="dot"></span>Laden…</span><button class="btn small ghost" id="logoutBtn" data-act="logout" hidden>Uitloggen</button></div>
  </header>
  <nav class="nav" id="nav" aria-label="Onderdelen">
    <a href="#overzicht" data-view="overzicht">Overzicht</a>
    <a href="#sponsoren" data-view="sponsoren">Sponsoren <span class="cnt" data-cnt="sponsors"></span></a>
    <a href="#bv" data-view="bv">BV: balans &amp; W&amp;V</a>
    <a href="#prive" data-view="prive">Privé-inkomen</a>
    <a href="#events" data-view="events">Events <span class="cnt" data-cnt="events"></span></a>
    <a href="#team" data-view="team">Team <span class="cnt" data-cnt="team"></span></a>
    <a href="#data" data-view="data">Gegevens</a>
    <a href="#beheer" data-view="beheer" id="navBeheer" hidden>Beheer</a>
  </nav>
  <main class="main" id="main"><div class="wrap"><p class="muted">Laden…</p></div></main>
</div>
<dialog id="dlg"><form id="dlgForm" novalidate></form></dialog>
<datalist id="wieList"></datalist>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-box" novalidate>
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#f4f4f2" stroke="#8a96a5" stroke-width="1"/><circle cx="20" cy="20" r="15.2" fill="#1b1b1b"/><circle cx="20" cy="20" r="11.4" fill="#1f63b4"/><circle cx="20" cy="20" r="7.6" fill="#d8352a"/><circle cx="20" cy="20" r="3.8" fill="#f2c12e"/></svg>
    <h2>Willem Bakker · teamportaal</h2>
    <p class="muted small">Log in met je voornaam en wachtwoord.</p>
    <div class="field"><label for="loginNaam">Voornaam</label><input id="loginNaam" name="naam" autocomplete="username" autocapitalize="none" required></div>
    <div class="field"><label for="loginWw">Wachtwoord</label><input id="loginWw" name="wachtwoord" type="password" autocomplete="current-password" required></div>
    <div class="err" id="loginErr" hidden></div>
    <button type="submit" class="btn primary" id="loginBtn">Inloggen</button>
  </form>
</div>
<div id="toast" class="toast" hidden></div>
<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eurFmt = new Intl.NumberFormat('nl-NL', {style:'currency', currency:'EUR', maximumFractionDigits:0});
const eur = n => eurFmt.format(Number(n) || 0);
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; const n = parseFloat(String(v == null ? '' : v).replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const numLoose = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; let s = String(v == null ? '' : v).trim().replace(/[€\s]/g, ''); if (!s) return 0; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); const n = parseFloat(s); return isNaN(n) ? 0 : n; };
const pad = n => String(n).padStart(2, '0');
const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const parseIso = iso => { if (!iso) return null; const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? null : d; };
const fmtDate = iso => { const d = parseIso(iso); return d ? d.toLocaleDateString('nl-NL', {day:'numeric', month:'short', year:'numeric'}) : '—'; };
const fmtDateLong = iso => { const d = parseIso(iso); return d ? d.toLocaleDateString('nl-NL', {weekday:'long', day:'numeric', month:'long', year:'numeric'}) : '—'; };
const daysUntil = iso => { const d = parseIso(iso); if (!d) return null; return Math.round((d - parseIso(todayIso())) / 86400000); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const by = (key, dir) => (a, b) => { const x = a[key] == null ? '' : a[key], y = b[key] == null ? '' : b[key]; return (x < y ? -1 : x > y ? 1 : 0) * (dir === 'desc' ? -1 : 1); };
const sum = (arr, fn) => arr.reduce((t, x) => t + num(fn(x)), 0);
const thisYear = () => new Date().getFullYear();
let toastTimer = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }

/* ---------- vaste gegevens ---------- */
const COLS = ['team', 'sponsors', 'bv', 'prive', 'events', 'mijlpalen', 'acties', 'programma', 'eventbudget', 'presentaties', 'settings'];

/* ---------- opslag: gedeeld (Claude-artifact db) of lokaal (browser) ---------- */
const Store = {
  mode: 'local', backend: null, cache: {}, listeners: [], error: null,
  all(col) { return this.cache[col] || []; },
  get(col, id) { return this.all(col).find(d => d.id === id) || null; },
  async put(col, doc) {
    if (!doc.id) doc.id = uid();
    const clean = {}; Object.keys(doc).forEach(k => { if (doc[k] !== undefined) clean[k] = doc[k]; });
    try { await this.backend.put(col, clean); } catch (e) { toast('Opslaan mislukt: ' + (e && e.code ? e.code : 'onbekende fout')); throw e; }
    return clean;
  },
  async del(col, id) {
    try { await this.backend.del(col, id); } catch (e) { toast('Verwijderen mislukt: ' + (e && e.code ? e.code : 'onbekende fout')); throw e; }
  },
  settings() { return this.get('settings', 'main') || SEED.settings[0]; },
  onChange(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach(fn => fn()); },
  async init() {
    COLS.forEach(c => { this.cache[c] = []; });
    let db = null;
    try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { db = null; }
    if (db) { this.mode = 'shared'; this.backend = DbBackend; await DbBackend.init(db); }
    else if (/^https?:/.test(location.protocol) && await ApiBackend.probe()) { this.mode = 'api'; this.backend = ApiBackend; if (ApiBackend.user) await ApiBackend.init(); }
    else { this.mode = 'local'; this.backend = LocalBackend; LocalBackend.init(); }
  },
  async bulk(writes) {
    if (this.backend.bulk) { try { await this.backend.bulk(writes); } catch (e) { toast('Opslaan mislukt: ' + (e && e.code ? e.code : 'onbekende fout')); throw e; } return; }
    for (const w of writes) { if (w.op === 'delete') await this.del(w.col, w.id); else await this.put(w.col, w.doc); }
  },
  exportJson() { const out = {}; COLS.forEach(c => { out[c] = this.all(c); }); out._export = {app:'willembakker-portaal', versie:1, datum:new Date().toISOString(), modus:this.mode}; return JSON.stringify(out, null, 2); },
  async importJson(text, replace) {
    const obj = JSON.parse(text); const writes = [];
    if (replace) COLS.forEach(c => this.all(c).forEach(d => writes.push({op:'delete', col:c, id:d.id})));
    COLS.forEach(c => { const arr = Array.isArray(obj[c]) ? obj[c] : []; arr.forEach(d => { if (d && typeof d === 'object' && d.id) writes.push({op:'set', col:c, id:d.id, doc:d}); }); });
    await this.bulk(writes);
  },
  async resetToSeed() {
    const writes = []; COLS.forEach(c => this.all(c).forEach(d => writes.push({op:'delete', col:c, id:d.id})));
    COLS.forEach(c => (SEED[c] || []).forEach(d => writes.push({op:'set', col:c, id:d.id, doc:Object.assign({}, d)})));
    await this.bulk(writes);
  }
};

const LocalBackend = {
  init() {
    let loaded = false;
    try { const raw = localStorage.getItem(LS_KEY); if (raw) { const obj = JSON.parse(raw); COLS.forEach(c => { Store.cache[c] = Array.isArray(obj[c]) ? obj[c] : []; }); loaded = true; } } catch (e) { loaded = false; }
    if (!loaded) { COLS.forEach(c => { Store.cache[c] = (SEED[c] || []).map(d => Object.assign({}, d)); }); this.save(); }
  },
  save() { try { localStorage.setItem(LS_KEY, JSON.stringify(Store.cache)); } catch (e) { /* opslag niet beschikbaar: alleen in geheugen */ } },
  async put(col, doc) { const arr = Store.cache[col]; const i = arr.findIndex(d => d.id === doc.id); if (i >= 0) arr[i] = doc; else arr.push(doc); this.save(); Store.emit(); },
  async del(col, id) { Store.cache[col] = Store.cache[col].filter(d => d.id !== id); this.save(); Store.emit(); }
};

const DbBackend = {
  db: null, ready: {}, unsubs: [],
  init(db) {
    this.db = db;
    return new Promise(resolve => {
      let pending = COLS.length, done = false;
      const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
      const timer = setTimeout(() => { Store.error = Store.error || {code:'timeout', message:'De gedeelde gegevens zijn nog niet bereikbaar.'}; finish(); }, 10000);
      COLS.forEach(col => {
        const unsub = db.collection(col).onSnapshot(snap => {
          Store.cache[col] = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
          Store.emit();
          if (!snap.metadata.fromCache && !this.ready[col]) { this.ready[col] = true; pending--; if (pending === 0) { Store.error = null; finish(); } }
        }, err => { Store.error = err; Store.emit(); finish(); });
        this.unsubs.push(unsub);
      });
    });
  },
  put(col, doc) { const data = Object.assign({}, doc); const id = data.id; delete data.id; return this.db.collection(col).doc(id).set(data); },
  del(col, id) { return this.db.collection(col).doc(id).delete(); }
};


/* ---------- server-opslag (Node-server op de Mac mini, met inlog) ---------- */
const ApiBackend = {
  user: null, es: null, versie: 0,
  async probe() {
    try { const r = await fetch('api/me', {credentials:'same-origin', headers:{'Accept':'application/json'}}); if (!(r.headers.get('content-type') || '').includes('application/json')) return false; if (r.status === 200) { this.user = await r.json(); return true; } if (r.status === 401) { this.user = null; return true; } return false; } catch (e) { return false; }
  },
  async req(method, path, body) {
    const r = await fetch(path, {method, credentials:'same-origin', headers:{'Content-Type':'application/json', 'Accept':'application/json'}, body: body === undefined ? undefined : JSON.stringify(body)});
    if (r.status === 401) { this.user = null; showLogin(); throw {code:'niet ingelogd'}; }
    let j = null; try { j = await r.json(); } catch (e) { j = null; }
    if (!r.ok) throw {code: (j && j.fout) || ('HTTP ' + r.status)};
    return j;
  },
  async load() { const j = await this.req('GET', 'api/data'); this.versie = j.versie; COLS.forEach(c => { Store.cache[c] = Array.isArray(j.data[c]) ? j.data[c] : []; }); Store.error = null; Store.emit(); },
  connect() {
    if (this.es || !window.EventSource) return;
    this.es = new EventSource('api/stream'); const self = this;
    this.es.addEventListener('change', e => { try { const v = JSON.parse(e.data).versie; if (v !== self.versie) self.load().catch(() => {}); } catch (x) { /* negeren */ } });
  },
  async init() { await this.load(); this.connect(); },
  async put(col, doc) { const arr = Store.cache[col]; const i = arr.findIndex(d => d.id === doc.id); if (i >= 0) arr[i] = doc; else arr.push(doc); Store.emit(); try { const j = await this.req('PUT', 'api/data/' + col + '/' + encodeURIComponent(doc.id), doc); this.versie = j.versie; } catch (e) { this.load().catch(() => {}); throw e; } },
  async del(col, id) { Store.cache[col] = Store.cache[col].filter(d => d.id !== id); Store.emit(); try { const j = await this.req('DELETE', 'api/data/' + col + '/' + encodeURIComponent(id)); this.versie = j.versie; } catch (e) { this.load().catch(() => {}); throw e; } },
  async bulk(writes) { const j = await this.req('POST', 'api/data/bulk', {writes}); this.versie = j.versie; await this.load(); },
  async login(naam, wachtwoord) { const j = await this.req('POST', 'api/login', {naam, wachtwoord}); this.user = j; },
  async logout() { try { await this.req('POST', 'api/logout', {}); } catch (e) { /* al uitgelogd */ } this.user = null; if (this.es) { this.es.close(); this.es = null; } COLS.forEach(c => { Store.cache[c] = []; }); }
};
function showLogin() { const l = $('#login'); l.hidden = false; const n = $('#loginNaam'); if (n && !n.value) n.focus(); }
function hideLogin() { $('#login').hidden = true; }

/* ---------- formulier-dialoog ---------- */
function fieldHtml(f, v) {
  const id = 'f_' + f.key; const val = v == null ? (f.default == null ? '' : f.default) : v;
  let input;
  if (f.type === 'select') {
    const opts = (f.options || []).map(o => { const ov = typeof o === 'object' ? o.v : o, ol = typeof o === 'object' ? o.l : o; return `<option value="${esc(ov)}"${String(ov) === String(val) ? ' selected' : ''}>${esc(ol)}</option>`; }).join('');
    input = `<select id="${id}" name="${esc(f.key)}">${f.allowEmpty ? '<option value="">—</option>' : ''}${opts}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea id="${id}" name="${esc(f.key)}" placeholder="${esc(f.placeholder || '')}">${esc(val)}</textarea>`;
  } else {
    const t = f.type === 'number' ? 'text' : (f.type || 'text');
    input = `<input id="${id}" name="${esc(f.key)}" type="${t}" value="${esc(val)}" placeholder="${esc(f.placeholder || '')}"${f.type === 'number' ? ' inputmode="decimal"' : ''}${f.list ? ` list="${esc(f.list)}" autocomplete="off"` : ''}${f.required ? ' required' : ''}>`;
  }
  return `<div class="field${f.half ? ' half' : ''}"><label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>${input}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
}
function openForm(opts) {
  const dlg = $('#dlg'), form = $('#dlgForm'); const values = opts.values || {};
  let html = `<h3>${esc(opts.title)}</h3>`;
  const fields = opts.fields; let i = 0;
  while (i < fields.length) {
    if (fields[i].half && fields[i + 1] && fields[i + 1].half) { html += `<div class="frow">${fieldHtml(fields[i], values[fields[i].key])}${fieldHtml(fields[i + 1], values[fields[i + 1].key])}</div>`; i += 2; }
    else { html += fieldHtml(fields[i], values[fields[i].key]); i++; }
  }
  html += `<div class="err" id="formErr" hidden></div><div class="dlg-actions">${opts.onDelete ? '<button type="button" class="btn danger" id="formDel">Verwijderen</button><span class="grow"></span>' : ''}<button type="button" class="btn" id="formCancel">Annuleren</button><button type="submit" class="btn primary">${esc(opts.submitLabel || 'Opslaan')}</button></div>`;
  form.innerHTML = html;
  $('#formCancel', form).onclick = () => dlg.close();
  if (opts.onDelete) { const b = $('#formDel', form); b.onclick = () => { if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Zeker? Klik nogmaals'; setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Verwijderen'; }, 4000); return; } dlg.close(); opts.onDelete(); }; }
  form.onsubmit = async e => {
    e.preventDefault();
    const data = {}; const missing = [];
    fields.forEach(f => { const el = form.elements[f.key]; let v = el ? el.value : ''; if (f.type === 'number') v = numLoose(v); else if (typeof v === 'string') v = v.trim(); if (f.required && (v === '' || v == null)) missing.push(f.label); data[f.key] = v; });
    const err = $('#formErr', form);
    if (missing.length) { err.textContent = 'Vul in: ' + missing.join(', '); err.hidden = false; return; }
    try { await opts.onSave(data); dlg.close(); } catch (ex) { err.textContent = 'Opslaan is niet gelukt. Probeer het nog eens.'; err.hidden = false; }
  };
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  const first = form.querySelector('input,select,textarea'); if (first) first.focus();
}

function sponsorKwartalen(jr) {
  const q = [0, 0, 0, 0];
  Store.all('sponsors').filter(s => VAST.includes(s.status) && sponsorActive(s, jr)).forEach(s => {
    const b = num(s.bedrag), k = Math.min(4, Math.max(1, num(s.kwartaal) || 1)) - 1;
    if (s.betaling === 'Per kwartaal') { for (let i = 0; i < 4; i++) q[i] += b / 4; }
    else if (s.betaling === 'Eenmalig') { if ((num(s.start) || jr) === jr) q[k] += b; }
    else q[k] += b;
  });
  return q;
}

}

/* ---------- acties ---------- */
const EVENT_CHILD = ['mijlpalen', 'acties', 'programma', 'eventbudget', 'presentaties'];
function openRecordForm(col, existing, extra) {
  const values = Object.assign({}, existing || {}, extra || {});
  const spec = FORMS[col](values);
  openForm({title: spec.title, fields: spec.fields, values, onDelete: existing ? async () => { await Store.del(col, existing.id); if (col === 'events') { for (const c of EVENT_CHILD) for (const r of evRows(c, existing.id)) await Store.del(c, r.id); UI.eventId = null; saveUi(); } toast('Verwijderd'); render(); } : null,
    onSave: async data => {
      const doc = Object.assign({}, existing || {}, data);
      if (!existing && EVENT_CHILD.includes(col)) doc.eventId = UI.eventId;
      if (col === 'bv') { const id = num(doc.jaar) + '-q' + num(doc.kwartaal); const clash = Store.get('bv', id); if (clash && (!existing || clash.id !== existing.id)) throw new Error('bestaat al'); if (existing && existing.id !== id) await Store.del('bv', existing.id); doc.id = id; }
      await Store.put(col, doc); toast('Opgeslagen'); render();
    }});
}
const ACTIONS = {
  add(d) { openRecordForm(d.col, null, d.col === 'bv' ? {jaar: num(d.jaar) || jaar(), kwartaal: num(d.kwartaal) || 1} : null); },
  edit(d) { const r = Store.get(d.col, d.id); if (r) openRecordForm(d.col, r); },
  'open-event'(d) { UI.eventId = d.id; UI.view = 'events'; saveUi(); if (location.hash !== '#events') location.hash = 'events'; else render(); },
  'close-event'() { UI.eventId = null; saveUi(); render(); },
  tab(d) { UI.eventTab = d.tab; saveUi(); render(); },

      onSave: async data => { await Store.put('events', Object.assign({}, e, data)); toast('Opgeslagen'); render(); }});

  doel() {
    const s = Store.settings(), jr = jaar(); const years = [jr, jr + 1, jr + 2];
    openForm({title: 'Sponsordoelen per jaar', fields: years.map(y => ({key:'d' + y, label:'Doel ' + y + ' (€)', type:'number'})), values: Object.fromEntries(years.map(y => ['d' + y, (s.doelen || {})[y] || ''])),
      onSave: async data => { const doelen = Object.assign({}, s.doelen || {}); years.forEach(y => { doelen[y] = num(data['d' + y]); }); await Store.put('settings', Object.assign({}, s, {id:'main', doelen})); toast('Doelen opgeslagen'); render(); }});
  },
  settings() {
    const s = Store.settings();
    openForm({title: 'Instellingen', fields: [{key:'jaar', label:'Huidig jaar (voor de overzichten)', type:'number', required:true}, {key:'volgendeVergadering', label:'Volgende vergadering', type:'date'}], values: {jaar: s.jaar || thisYear(), volgendeVergadering: s.volgendeVergadering || ''},
      onSave: async data => { await Store.put('settings', Object.assign({}, s, {id:'main', jaar: num(data.jaar), volgendeVergadering: data.volgendeVergadering})); toast('Opgeslagen'); render(); }});
  },
  async logout() { if (Store.mode !== 'api') return; await ApiBackend.logout(); UI.usersLoaded = false; UI.users = []; setMode(); render(); showLogin(); },
  'ww-hide'() { UI.nieuwWw = null; render(); },
  'user-add'() {
    openForm({title: 'Gebruiker toevoegen', fields: [{key:'naam', label:'Inlognaam (voornaam, kleine letters)', required:true, placeholder:'bijv. piet'}, {key:'weergave', label:'Naam zoals getoond', required:true}, {key:'rol', label:'Rol', placeholder:'bijv. Sponsoring'}, {key:'admin', label:'Beheerder', type:'select', options:[{v:'nee', l:'Nee'}, {v:'ja', l:'Ja'}]}, {key:'wachtwoord', label:'Wachtwoord (leeg = automatisch)', type:'text', hint:'Minimaal 8 tekens.'}],
      onSave: async data => { const j = await ApiBackend.req('POST', 'api/gebruikers', {naam: data.naam.toLowerCase(), weergave: data.weergave, rol: data.rol, admin: data.admin === 'ja', wachtwoord: data.wachtwoord || undefined}); if (j.wachtwoord) UI.nieuwWw = {naam: j.naam, wachtwoord: j.wachtwoord}; UI.usersLoaded = false; toast('Gebruiker toegevoegd'); render(); }});
  },
  'user-edit'(d) {
    const u = (UI.users || []).find(x => x.naam === d.naam); if (!u) return;
    openForm({title: 'Gebruiker bewerken: ' + u.naam, fields: [{key:'weergave', label:'Naam zoals getoond', required:true}, {key:'rol', label:'Rol'}, {key:'admin', label:'Beheerder', type:'select', options:[{v:'nee', l:'Nee'}, {v:'ja', l:'Ja'}]}], values: {weergave: u.weergave, rol: u.rol, admin: u.admin ? 'ja' : 'nee'},
      onDelete: async () => { try { await ApiBackend.req('DELETE', 'api/gebruikers/' + encodeURIComponent(u.naam)); UI.usersLoaded = false; toast('Verwijderd'); } catch (e) { toast('Verwijderen mislukt: ' + e.code); } render(); },
      onSave: async data => { await ApiBackend.req('PUT', 'api/gebruikers/' + encodeURIComponent(u.naam), {weergave: data.weergave, rol: data.rol, admin: data.admin === 'ja'}); UI.usersLoaded = false; toast('Opgeslagen'); render(); }});
  },
  async 'user-ww'(d, el) {
    if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Zeker? Klik nogmaals'; setTimeout(() => { el.classList.remove('armed'); el.textContent = 'Nieuw wachtwoord'; }, 4000); return; }
    try { const j = await ApiBackend.req('PUT', 'api/gebruikers/' + encodeURIComponent(d.naam), {nieuwWachtwoord: true}); UI.nieuwWw = {naam: d.naam, wachtwoord: j.wachtwoord}; render(); } catch (e) { toast('Mislukt: ' + e.code); }
  },
  'ww-change'() {
    openForm({title: 'Wachtwoord wijzigen', fields: [{key:'huidig', label:'Huidig wachtwoord', type:'password', required:true}, {key:'nieuw', label:'Nieuw wachtwoord', type:'password', required:true, hint:'Minimaal 8 tekens.'}, {key:'herhaal', label:'Nieuw wachtwoord (nogmaals)', type:'password', required:true}],
      onSave: async data => { if (data.nieuw !== data.herhaal) { toast('De nieuwe wachtwoorden zijn niet gelijk'); throw new Error('ongelijk'); } if (data.nieuw.length < 8) { toast('Minimaal 8 tekens'); throw new Error('kort'); } try { await ApiBackend.req('POST', 'api/wachtwoord', {huidig: data.huidig, nieuw: data.nieuw}); toast('Wachtwoord gewijzigd'); } catch (e) { toast('Mislukt: ' + e.code); throw e; } }});
  },
  export() { UI.exportText = Store.exportJson(); render(); const a = $('#dlLink'); if (a) { try { a.href = URL.createObjectURL(new Blob([UI.exportText], {type:'application/json'})); } catch (e) { a.remove(); } } },
  async copy() { const t = UI.exportText; try { await navigator.clipboard.writeText(t); toast('Gekopieerd'); } catch (e) { const box = $('#exportBox'); if (box) { box.focus(); box.select(); } toast('Selecteer de tekst en kopieer met Ctrl+C'); } },
  async 'import-add'() { await doImport(false); },
  async 'import-replace'(d, el) { if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Zeker? Alles wordt gewist. Klik nogmaals'; setTimeout(() => { el.classList.remove('armed'); el.textContent = 'Alles vervangen'; }, 5000); return; } await doImport(true); },
  async reset(d, el) {
    if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Zeker? Klik nogmaals om alles te wissen'; setTimeout(() => { el.classList.remove('armed'); el.textContent = 'Alles wissen en startgegevens terugzetten'; }, 5000); return; }
    el.disabled = true; try { await Store.resetToSeed(); toast('Startgegevens teruggezet'); } catch (e) { /* al gemeld */ } UI.eventId = null; render();
  }
};
async function doImport(replace) {
  let text = ($('#importBox') || {}).value || '';
  const fileEl = $('#importFile');
  if (!text.trim() && fileEl && fileEl.files && fileEl.files[0]) text = await fileEl.files[0].text();
  if (!text.trim()) { toast('Plak eerst een export of kies een bestand'); return; }
  try { await Store.importJson(text, replace); toast('Import klaar'); render(); } catch (e) { toast('Import mislukt: controleer of het een geldige export is'); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const h = ACTIONS[el.dataset.act]; if (!h) return;
  e.preventDefault(); h(el.dataset, el);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  if (el.dataset.change === 'year') { UI[el.dataset.scope] = num(el.value); saveUi(); render(); }
  if (el.dataset.change === 'actiefilter') { UI.actieFilter = el.value; saveUi(); render(); }
});

/* ---------- navigatie en renderen ---------- */
function route() { const h = (location.hash || '#overzicht').slice(1); UI.view = VIEWS[h] ? h : 'overzicht'; }
let raf = null;
function renderSoon() { if (raf) return; raf = requestAnimationFrame(() => { raf = null; render(); }); }
function render() {
  const main = $('#main'); const y = main.scrollTop;
  try { main.innerHTML = VIEWS[UI.view](); } catch (e) { main.innerHTML = `<div class="wrap"><div class="notice bad">Er ging iets mis bij het tonen van dit scherm (${esc(e.message)}).</div></div>`; }
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.view === UI.view));
  const names = new Set(wieOptions()); ['acties', 'mijlpalen', 'programma', 'presentaties'].forEach(c => Store.all(c).forEach(r => { if (r.wie) names.add(r.wie); if (r.eigenaar) names.add(r.eigenaar); })); Store.all('events').forEach(e => { if (e.coordinator) names.add(e.coordinator); if (e.presentator) names.add(e.presentator); });
  $('#wieList').innerHTML = Array.from(names).sort().map(n => `<option value="${esc(n)}"></option>`).join('');
  document.querySelectorAll('[data-cnt]').forEach(el => { const c = el.dataset.cnt; const n = c === 'events' ? Store.all('events').filter(ev => ev.status !== 'Afgerond' && ev.status !== 'Geannuleerd').length : Store.all(c).length; el.textContent = n || ''; el.hidden = !n; });
  main.scrollTop = y;
}
function setMode() {
  const b = $('#modeBadge');
  if (Store.error) { b.className = 'pill bad'; b.innerHTML = '<span class="dot"></span>Opslag niet bereikbaar'; }
  else if (Store.mode === 'shared') { b.className = 'pill ok'; b.innerHTML = '<span class="dot"></span>Gedeeld met het team' + (UI.readOnly ? ' · alleen lezen' : ''); }
  else if (Store.mode === 'api') { const u = ApiBackend.user; b.className = 'pill ' + (u ? 'ok' : 'warn'); b.innerHTML = '<span class="dot"></span>' + (u ? 'Ingelogd als ' + esc(u.weergave || u.naam) : 'Niet ingelogd'); $('#logoutBtn').hidden = !u; $('#navBeheer').hidden = !(u && u.admin); }
  else { b.className = 'pill warn'; b.innerHTML = '<span class="dot"></span>Alleen in deze browser'; }
}
window.addEventListener('hashchange', () => { route(); if (UI.view !== 'events') { /* eventkeuze blijft bewaard */ } render(); });
Store.onChange(() => { renderSoon(); setMode(); });
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); const err = $('#loginErr'); err.hidden = true; const btn = $('#loginBtn'); btn.disabled = true;
  try { await ApiBackend.login($('#loginNaam').value.trim().toLowerCase(), $('#loginWw').value); $('#loginWw').value = ''; hideLogin(); await ApiBackend.init(); setMode(); render(); }
  catch (ex) { err.textContent = ex && ex.code === 'ongeldig' ? 'Onbekende naam of verkeerd wachtwoord.' : ex && ex.code === 'geblokkeerd' ? 'Te veel pogingen. Probeer het over een kwartier opnieuw.' : 'Inloggen is niet gelukt (' + esc(ex && ex.code || 'fout') + ').'; err.hidden = false; }
  btn.disabled = false;
});
(async function init() {
  route();
  await Store.init();
  if (Store.mode === 'api' && !ApiBackend.user) { setMode(); $('#main').innerHTML = '<div class="wrap"><p class="muted">Log in om het portaal te gebruiken.</p></div>'; showLogin(); return; }
  if (Store.mode === 'shared') { try { const user = window.claude && await window.claude.use('user'); if (user) { const w = await user.can('data.write'); if (w === false) UI.readOnly = true; } } catch (e) { /* onbekend: bewerken toestaan */ } }
  setMode(); render();
})();
})();
</script>
</body>
</html>
